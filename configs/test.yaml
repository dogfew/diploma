experiment_name: "production_experiment_v1"
device: "cpu"
seed: 888

market:
  start_volumes: 10
  base_price: 15
  start_gains: 64
  deprecation_steps: 2
  min_price: 1
  max_price: 16

prod_functions:
  - type: "Leontief"
    inputs: [0, 4]
    outputs: [5, 0]
  - type: "Leontief"
    inputs: [4, 0]
    outputs: [0, 5]
  # - type: "Leontief"
  #   inputs: [0, 4]
  #   outputs: [5, 0]
  # - type: "Leontief"
  #   inputs: [4, 0]
  #   outputs: [0, 5]
  # - type: "Leontief"
  #   inputs: [4, 0]
  #   outputs: [0, 5]

invest_functions:
  - type: "Leontief"
    inputs: [1, 1]
    outputs: 2
  - type: "Leontief"
    inputs: [1, 1]
    outputs: 2
  # - type: "Leontief"
  #   inputs: [1, 1]
  #   outputs: 2
  # - type: "Leontief"
  #   inputs: [1, 1]
  #   outputs: 2
  # - type: "Leontief"
  #   inputs: [1, 1]
  #   outputs: 2

environment:
  policy_class: "BetaPolicyNetwork"
  target: "production"
  percent_prices: false
  production_reg: 0
  is_blind: true
  batch_size: 1024
  hidden_dim: 64

trainer:
  trainer_class: "TrainerPPO"
  learning_rates: [0.0003, 0.002]
  entropy_reg: 0.01
  max_grad_norm: 0.5
  entropy_gamma: 0.999
  social_planner: false
  lr_gamma: 0.999
  common_optimizer: true
  normalize_advantages: true
  critic_hidden_dim: 192

training_params:
  n_epochs: 256
  episode_length: 48
  debug_period: 20
  shuffle_order: false

evaluation:
  n_periods: 64
  eval_batch_size: 512
